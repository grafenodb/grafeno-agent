name: Release

# A tag v<version>, only after the whole pipeline (checks and evaluation)
# is green, and only when the tag matches package.json and CHANGELOG.md
# has a section for it, makes a GitHub release with the package, as
# grafenodb-agent-cli-<version>.tgz and as grafeno-agent.tgz (what
# releases/latest/download/grafeno-agent.tgz installs). publish.yml
# publishes the same version to npm.
# See RELEASING.md: releasing is a decision of the owner.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/ci.yml

  sandbox:
    uses: ./.github/workflows/sandbox.yml

  github-release:
    needs: [pipeline, sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: The tag must match the package's version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
          grep -q "^## $version" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - name: Grafeno Sandbox's helpers, built and attacked by the Sandbox workflow
        uses: actions/download-artifact@v7
        with:
          pattern: sandbox-linux-*
          path: vendor-artifacts
      - name: The helpers in the package, with their manifest
        run: |
          for arch in x64 arm64; do
            mkdir -p "vendor/sandbox/linux-$arch"
            cp "vendor-artifacts/sandbox-linux-$arch/grafeno-sandbox" "vendor/sandbox/linux-$arch/grafeno-sandbox"
          done
          node scripts/sandbox-helper.mjs manifest --require linux-x64,linux-arm64
      - name: Pack and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm pack
          file="grafenodb-agent-cli-$version.tgz"
          cp "$file" grafeno-agent.tgz
          sha256sum "$file" grafeno-agent.tgz > SHA256SUMS
          awk -v v="$version" '$0 ~ "^## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$file" grafeno-agent.tgz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Grafeno Agent $version" --notes-file notes.md
